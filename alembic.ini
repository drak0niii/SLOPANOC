; SLOPANOC — Alembic configuration for SLOPANOC-owned schemas only
; (Case/Fault Context, Governed Knowledge). ADK's own DatabaseSessionService
; tables are NOT managed here -- ADK continues creating/evolving its own
; schema internally (see alembic/env.py's own docstring).
;
; sqlalchemy.url is deliberately NOT set here -- alembic/env.py resolves the
; real database URL at runtime via backend.config.settings.get_settings()
; .resolve_database_url(), the exact same resolver the FastAPI app itself
; uses (SLOPANOC_DATABASE_URL / SLOPANOC_DATABASE_SECRET_RESOURCE / local
; SQLite default). A production PostgreSQL/Cloud SQL URL is a credential --
; it must never be committed to this file.

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
