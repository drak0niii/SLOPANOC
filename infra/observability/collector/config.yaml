      - set(unit, "s") where name == "slopanoc.turn.duration"
      - set(unit, "s") where IsMatch(name, "^(slopanoc[.]accounting[.](admission_duration|capture_duration)|slopanoc[.]finops[.](billing|pricing|focus)[.](ingestion_duration|source_age))$")
  resource/environment:
    attributes:
    - key: deployment.environment.name
      value: ${env:SLOPANOC_ENVIRONMENT}
      action: upsert
  batch:
    send_batch_size: 200
    send_batch_max_size: 200
    timeout: 1s
  resourcedetection/gcp:
    detectors:
    - gcp
    timeout: 2s
    override: false
service:
  extensions:
  - health_check
  telemetry:
    logs:
      level: warn
    metrics:
      readers:
      - pull:
          exporter:
            prometheus:
              host: 127.0.0.1
              port: ${env:SELF_METRICS_PORT}
  pipelines:
    traces:
      receivers:
      - otlp
      processors:
      - memory_limiter
      - filter/safe_scope
      - transform/redact
      - resource/environment
      - resourcedetection/gcp
      - batch
      exporters:
      - googlecloud
    metrics:
      receivers:
      - otlp
      processors:
      - memory_limiter
      - filter/safe_scope
      - transform/redact
      - resource/environment
      - resourcedetection/gcp
      - batch
      exporters:
      - googlecloud
    logs:
      receivers:
      - otlp
      processors:
      - memory_limiter
      - filter/safe_scope
      - transform/redact
      - resource/environment
      - resourcedetection/gcp
      - batch
      exporters:
      - googlecloud
exporters:
  googlecloud:
    project: ${env:GOOGLE_CLOUD_PROJECT}
    timeout: 5s
    sending_queue:
      enabled: true
      num_consumers: 1
      queue_size: 128
    metric:
      prefix: custom.googleapis.com/slopanoc
      service_resource_labels: false
      instrumentation_library_labels: false
    log:
      default_log_name: slopanoc
