receivers:
  otlp:
    protocols:
      http:
        endpoint: 127.0.0.1:${env:OTLP_PORT}
extensions:
  health_check:
    endpoint: 0.0.0.0:${env:HEALTH_PORT}
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 160
    spike_limit_mib: 32
  filter/safe_scope:
    error_mode: propagate
    traces:
      span:
      - instrumentation_scope.name != "slopanoc.observability"
      - Len(links) > 0
      - not IsMatch(name, "^(db[.]client|db[.]connection|db[.]transaction|http[.]client|knowledge[.]retrieval|secretmanager[.]client|storage[.]client|slopanoc[.](agent|tool)|gen_ai[.]request|slopanoc[.]model[.](operation|validation)|slopanoc[.]turn|request|session[.]load|attachments|orchestration|planning|thread[.]resolve|pending_interaction[.]resolve|context[.]select|finalization|persistence[.]final_answer|sse[.]complete|request[.]received|request[.]validated|session[.]load[.]started|session[.]load[.]completed|attachments[.]started|attachments[.]completed|planning[.]started|planning[.]model[.]started|planning[.]model[.]completed|planning[.]completed|planning[.]failed|thread[.]resolve[.]started|thread[.]resolve[.]completed|pending_interaction[.]resolve[.]started|pending_interaction[.]resolve[.]completed|source_requirements[.]completed|context[.]selection[.]started|context[.]selection[.]completed|context[.]item[.]selected|context[.]item[.]excluded|agent[.]started|agent[.]completed|agent[.]failed|agent[.]team_manager|agent[.]technical_authority|agent[.]incident_manager|agent[.]problem_manager|agent[.]automated_operations|model[.]request[.]started|model[.]first_token|model[.]request[.]completed|model[.]request[.]failed|model[.]request[.]timeout|tool[.]started|tool[.]completed|tool[.]failed|tool[.]timeout|knowledge[.]search[.]started|knowledge[.]search[.]completed|teams[.]list_chats[.]started|teams[.]list_chats[.]completed|teams[.]read_messages[.]started|teams[.]read_messages[.]completed|database[.]query[.]started|database[.]query[.]completed|storage[.]operation[.]started|storage[.]operation[.]completed|knowledge[.]selection[.]completed|procedure_action[.]resolved|command_authority[.]completed|approval[.]requested|approval[.]completed|authority[.]selected|provenance[.]completed|command_egress[.]completed|synthesis[.]started|synthesis[.]completed|persistence[.]started|persistence[.]completed|sse[.]started|sse[.]completed|turn[.]completed|turn[.]failed|turn[.]timeout|turn[.]cancelled|run[.]stalled|heartbeat|telemetry[.]initialized|telemetry[.]degraded|telemetry[.]shutdown|telemetry[.]legacy_log|reliability[.]late_completion)$")
      spanevent:
      - not IsMatch(name, "^(reliability[.]cleanup_completed|reliability[.]cleanup_failed|reliability[.]cleanup_started|reliability[.]cleanup_timeout|reliability[.]controller_failed|reliability[.]deadline_exceeded|reliability[.]deadline_nearing|reliability[.]late_completion|reliability[.]progress_resumed|reliability[.]worker_running|run[.]stalled|procedure_action[.]resolved|command_authority[.]completed|agent[.](started|completed|failed)|tool[.](started|completed|failed|timeout)|approval[.](requested|completed)|model[.](request[.](started|completed|failed|timeout)|first_token)|agent[.]team_manager|attachments[.]completed|attachments[.]started|authority[.]selected|command_egress[.]completed|context[.]selection[.]completed|context[.]selection[.]started|pending_interaction[.]resolve[.]completed|pending_interaction[.]resolve[.]started|persistence[.]completed|persistence[.]started|planning[.]completed|planning[.]failed|planning[.]started|provenance[.]completed|request[.]received|request[.]validated|session[.]load[.]completed|session[.]load[.]started|source_requirements[.]completed|sse[.]completed|sse[.]started|synthesis[.]completed|synthesis[.]started|thread[.]resolve[.]completed|thread[.]resolve[.]started|turn[.]cancelled|turn[.]completed|turn[.]failed|turn[.]timeout)$")
