      - IsMatch(metric.name, "^(slopanoc[.]turn[.]accepted|slopanoc[.]safety[.]violations|slopanoc[.]turn[.]active|slopanoc[.]slo[.]bad_fraction|slopanoc[.]slo[.]eligible|slopanoc[.]slo[.]unknown|slopanoc[.]slo[.]budget_remaining|slopanoc[.]slo[.]source_age|slopanoc[.]persistence[.]pending|slopanoc[.]persistence[.]failed|slopanoc[.]turn[.]duration|slopanoc[.]accounting[.](admissions_attempted|admissions_failed|provider_started|observations|inbox_accepted|ledger_persisted|duplicates|conflicts|replayed|persistence_failures|metadata_missing|pending|debt|capture_duration|admission_duration)|slopanoc[.]finops[.](billing|pricing|focus)[.](extractions|publications|failures|rows|identical_generations|late_rows|correction_rows|unmapped_rows|schema_incompatible|stale_reads|bytes_processed|source_age|unmapped_ratio|ingestion_duration))$") and (attributes["operation"] == nil or not IsString(attributes["operation"]) or not IsMatch(attributes["operation"], "^(COMPLEX_MULTI_AGENT|GENERAL|GOVERNED_TROUBLESHOOTING|TEAMS_LOOKUP|UNKNOWN|accepted|availability|command_egress_bypass|cost_ledger_completeness|credential_telemetry_leak|dependency_database|dependency_gateway|dependency_graph|dependency_knowledge|dependency_storage|hidden_cot_persistence|latency_complex|latency_general|latency_teams|latency_troubleshooting|model_reliability|model_ttft|projection|sse_delivery|terminal_completion|trace_completeness|unauthorized_command_exposure)$"))
