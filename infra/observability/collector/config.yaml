      - IsMap(body) and body["message"] != body["event_name"]
    metrics:
      metric:
      - instrumentation_scope.name != "slopanoc.observability"
      - not IsMatch(name, "^(slopanoc[.]cleanup[.]duration|slopanoc[.]cleanup[.]failures|slopanoc[.]cleanup[.]timeouts|slopanoc[.]executor[.]admission_rejected|slopanoc[.]executor[.]saturation|slopanoc[.]queue[.]saturation|slopanoc[.]reliability[.]controller_failures|slopanoc[.]reliability[.]deadline_overshoot|slopanoc[.]reliability[.]retries|slopanoc[.]reliability[.](retry_denied|retry_exhausted)|slopanoc[.]session[.]lock_wait|slopanoc[.]stage[.]timeouts|slopanoc[.]turn[.]cancellations|slopanoc[.]turn[.]progress_resumed|slopanoc[.]turn[.]stall_duration|slopanoc[.]turn[.]stalls|slopanoc[.]turn[.]timeouts|slopanoc[.]work[.]detached|slopanoc[.]work[.]late_completions|slopanoc[.]db[.]connection_acquire_duration|slopanoc[.]db[.]pool[.]checked_in|slopanoc[.]db[.]pool[.]checked_out|slopanoc[.]db[.]pool[.]connections|slopanoc[.]db[.]pool[.]exhaustion|slopanoc[.]db[.]pool[.]overflow|slopanoc[.]db[.]pool[.]size|slopanoc[.]dependency[.]duration|slopanoc[.]dependency[.]failures|slopanoc[.]dependency[.]pages|slopanoc[.]dependency[.]rate_limits|slopanoc[.]dependency[.]requests|slopanoc[.]dependency[.]retries|slopanoc[.]dependency[.]timeouts|slopanoc[.]knowledge[.]fallback|slopanoc[.]knowledge[.]no_result|slopanoc[.]knowledge[.]stage[.]duration|slopanoc[.]storage[.]bytes_downloaded|slopanoc[.]storage[.]bytes_uploaded|slopanoc[.]agent[.](executions|failures|duration)|slopanoc[.]tool[.](invocations|failures|timeouts|duration)|gen_ai[.]client[.]operation[.]duration|slopanoc[.]model[.](requests|retries|failures|timeouts|usage_unavailable|ttft|input_tokens|output_tokens|cached_tokens|candidate_tokens)|slopanoc[.]telemetry[.](accepted|attempts|exported|failed|dropped|filtered|queue_size|export_duration_ms|shutdown_failed))$") and not IsMatch(name, "^(slopanoc[.]turn[.]accepted|slopanoc[.]safety[.]violations|slopanoc[.]turn[.]active|slopanoc[.]slo[.]bad_fraction|slopanoc[.]slo[.]eligible|slopanoc[.]slo[.]unknown|slopanoc[.]slo[.]budget_remaining|slopanoc[.]slo[.]source_age|slopanoc[.]pe