      - (IsMatch(metric.name, "^(slopanoc[.]db[.]connection_acquire_duration|slopanoc[.]db[.]pool[.]checked_in|slopanoc[.]db[.]pool[.]checked_out|slopanoc[.]db[.]pool[.]connections|slopanoc[.]db[.]pool[.]exhaustion|slopanoc[.]db[.]pool[.]overflow|slopanoc[.]db[.]pool[.]size|slopanoc[.]dependency[.]duration|slopanoc[.]dependency[.]failures|slopanoc[.]dependency[.]pages|slopanoc[.]dependency[.]rate_limits|slopanoc[.]dependency[.]requests|slopanoc[.]dependency[.]retries|slopanoc[.]dependency[.]timeouts|slopanoc[.]knowledge[.]fallback|slopanoc[.]knowledge[.]no_result|slopanoc[.]knowledge[.]stage[.]duration|slopanoc[.]storage[.]bytes_downloaded|slopanoc[.]storage[.]bytes_uploaded)$") and exemplars != nil and Len(exemplars) > 0) and not IsMatch(metric.name, "^(slopanoc[.]turn[.]accepted|slopanoc[.]safety[.]violations|slopanoc[.]turn[.]active|slopanoc[.]slo[.]bad_fraction|slopanoc[.]slo[.]eligible|slopanoc[.]slo[.]unknown|slopanoc[.]slo[.]budget_remaining|slopanoc[.]slo[.]source_age|slopanoc[.]persistence[.]pending|slopanoc[.]persistence[.]failed|slopanoc[.]turn[.]duration|slopanoc[.]accounting[.](admissions_attempted|admissions_failed|provider_started|observations|inbox_accepted|ledger_persisted|duplicates|conflicts|replayed|persistence_failures|metadata_missing|pending|debt|capture_duration|admission_duration)|slopanoc[.]finops[.](billing|pricing|focus)[.](extractions|publications|failures|rows|identical_generations|late_rows|correction_rows|unmapped_rows|schema_incompatible|stale_reads|bytes_processed|source_age|unmapped_ratio|ingestion_duration))$")
