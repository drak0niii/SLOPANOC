# =====================================================================
# SLOPANOC pytest configuration (POST-6A).
#
# WHY THIS FILE EXISTS: until now the suite had no pytest configuration
# at all, so tests that depend on resources OUTSIDE this repository --
# real MOP documents on one developer's machine -- were silently skipped
# on every other machine. A silent skip reads exactly like a pass in the
# summary line, which is the wrong way round for a test whose entire
# value is that it ran against real material.
#
# Those tests are now DECLARED as `live` and DESELECTED by default, so a
# default run reports what it actually did, and running them is a
# deliberate act:
#
#     pytest                    # hermetic suite only
#     pytest -m live            # only the externally-dependent tests
#     pytest -m ""              # everything, live included
# =====================================================================
[pytest]
testpaths = backend/tests
markers =
    live: requires a resource outside this repository (real corpus files
        on a specific machine, a real database, a real gateway). NEVER
        run as part of the default suite, and never a substitute for a
        hermetic test of the same behaviour.

# Deselected by default -- see above. A `live` test that cannot find its
# external resource still skips, but now nothing is silently skipped in
# an ordinary run.
addopts = -m "not live"

asyncio_default_fixture_loop_scope = function
